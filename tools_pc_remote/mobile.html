<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b12">
<title>小车手机手柄 · 自动驾驶</title>
<style>
  :root {
    --bg: #070b12;
    --card: rgba(16, 26, 40, 0.86);
    --line: rgba(255, 255, 255, 0.09);
    --cy: #00f2fe;
    --gr: #00e676;
    --rd: #ff3366;
    --am: #ffb300;
    --vi: #b388ff;
    --mut: #8899a6;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 18% 8%, rgba(0, 242, 254, 0.10) 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(179, 136, 255, 0.10) 0%, transparent 42%);
    color: #e8f1f8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* ── 状态小框：原顶部状态条已取消，横屏放到按键行的另一侧 ── */
  .status-boxes {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    min-width: 0;
    flex-wrap: wrap;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(255, 51, 102, 0.15);
    color: var(--rd);
    border: 1px solid rgba(255, 51, 102, 0.35);
    white-space: nowrap;
    transition: all .25s;
  }

  .pill.on {
    background: rgba(0, 230, 118, 0.15);
    color: var(--gr);
    border-color: rgba(0, 230, 118, 0.4);
    box-shadow: 0 0 10px rgba(0, 230, 118, 0.22);
  }

  .dot {
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 7px currentColor;
  }

  .badge {
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--mut);
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  .badge.run { background: rgba(0, 230, 118, 0.16); color: var(--gr); border-color: rgba(0, 230, 118, 0.35); }
  .badge.brake { background: rgba(255, 179, 0, 0.16); color: var(--am); border-color: rgba(255, 179, 0, 0.35); }

  /* ── 主体：左摇杆 + 右数据 ── */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 8px;
    padding-top: calc(8px + env(safe-area-inset-top));
    padding-right: calc(8px + env(safe-area-inset-right));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    padding-left: calc(8px + env(safe-area-inset-left));
  }

  .left {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    min-width: 0;
    min-height: 0;
  }

  .stick-zone {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }

  .ctrl-row, .spd { position: relative; z-index: 2; }

  .stick {
    position: relative;
    width: min(100%, 42vh);
    aspect-ratio: 1 / 1;
    flex: 0 0 auto;
    pointer-events: auto;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.07) 0%, rgba(5, 8, 14, 0.96) 70%);
    border: 2px solid rgba(0, 242, 254, 0.22);
    box-shadow: 0 0 26px rgba(0, 242, 254, 0.10), inset 0 0 30px rgba(0, 0, 0, 0.7);
    touch-action: none;
  }

  .stick::before,
  .stick::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.07);
  }

  .stick::before { left: 50%; top: 8%; width: 1px; height: 84%; transform: translateX(-0.5px); }
  .stick::after { top: 50%; left: 8%; height: 1px; width: 84%; transform: translateY(-0.5px); }

  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40%;
    height: 40%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #1de9ff 0%, #0091a8 60%, #005f70 100%);
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), inset 0 -4px 10px rgba(0, 0, 0, 0.45);
    transition: transform .08s ease-out, box-shadow .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    color: #04222a;
    letter-spacing: 1px;
  }

  .knob.live {
    box-shadow: 0 0 30px rgba(0, 242, 254, 0.9), inset 0 -4px 10px rgba(0, 0, 0, 0.45);
    transition: none;
  }

  /* 底部一条：左边小按键，右边状态小框，再下面是拉长的限速条 */
  .ctrl-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .mini-btns { display: flex; gap: 6px; flex: 0 0 auto; }

  .btn {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: #e8f1f8;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    touch-action: none;
    transition: transform .06s, background .15s;
  }

  .btn:active { transform: scale(0.96); }

  .btn.run { background: rgba(0, 230, 118, 0.14); border-color: rgba(0, 230, 118, 0.4); color: var(--gr); }
  .btn.run:active { background: var(--gr); color: #05210f; }

  .spd {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    min-width: 0;
  }

  .spd span { font-size: 10px; color: var(--mut); white-space: nowrap; flex: 0 0 auto; }

  .spd b {
    font-family: Consolas, monospace;
    font-size: 12px;
    color: var(--am);
    width: 36px;
    flex: 0 0 auto;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 0;
    min-width: 0;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.15);
    outline: none;
    touch-action: auto;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--cy);
    box-shadow: 0 0 10px var(--cy);
  }

  /* ── 右列 ── */
  .right {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    min-height: 0;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
  }

  .compass-card {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
  }

  /* 与电脑端同一套罗盘：旋转刻度环 + 中央航向读数 */
  .compass-dial {
    width: min(100%, 190px);
    aspect-ratio: 1 / 1;
    position: relative;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 24, 39, 0.9) 0%, rgba(5, 8, 14, 0.95) 100%);
    border: 2px solid rgba(0, 242, 254, 0.3);
    box-shadow: 0 0 22px rgba(0, 242, 254, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .compass-needle-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    transition: transform .08s linear;
  }

  .compass-val {
    position: absolute;
    text-align: center;
    z-index: 2;
    pointer-events: none;
    padding: 3px 8px;
    border-radius: 9px;
    background: rgba(5, 8, 14, 0.82);
    box-shadow: 0 0 12px rgba(5, 8, 14, 0.9);
  }

  .compass-val .deg {
    font-family: Consolas, monospace;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--cy);
    line-height: 1.1;
  }

  .compass-val .sub {
    font-size: 9px;
    color: var(--cy);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
  }

  .stat.divider { border-top: 1px solid var(--line); padding-top: 6px; }

  .stat > span {
    font-size: 9px;
    letter-spacing: .8px;
    color: var(--mut);
    line-height: 1.2;
  }

  .stat p {
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .stat b {
    font-family: Consolas, monospace;
    font-size: 22px;
    color: #fff;
    font-weight: 800;
    letter-spacing: -.5px;
    line-height: 1.15;
  }

  .stat i { font-style: normal; font-size: 10px; color: var(--mut); }

  .map-card {
    flex: 1;
    min-height: 120px;
    touch-action: none;
  }

  #mapCanvas { width: 100%; height: 100%; display: block; }

  .map-tip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 4px 8px;
    font-size: 10px;
    color: var(--mut);
    background: linear-gradient(transparent, rgba(5, 8, 14, 0.85));
    text-align: center;
    pointer-events: none;
  }

  .map-card:active { border-color: rgba(0, 242, 254, 0.4); }

  /* ── 全屏自动驾驶面板 ── */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    background-color: #05080f;
    background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.10) 0%, rgba(5, 8, 15, 0) 55%);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .modal.show { display: flex; }

  .modal-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: rgba(8, 12, 20, 0.95);
  }

  .modal-head b { font-size: 15px; letter-spacing: .5px; }

  .modal-head .st {
    font-size: 11px;
    color: var(--cy);
    font-family: Consolas, monospace;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55vw;
  }

  .xbtn {
    width: 34px;
    height: 30px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    font-size: 15px;
    font-weight: 700;
  }

  .modal-map {
    flex: 1;
    min-height: 0;
    margin: 8px;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: rgba(10, 16, 26, 0.7);
    touch-action: none;
  }

  .modal-map .map-card {
    position: absolute;
    inset: 0;
    border: none;
    border-radius: 0;
    min-height: 0;
  }

  .modal-map .map-tip { display: none; }

  .modal-ctrl {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px 5px;
    border-top: 1px solid var(--line);
    background: rgba(8, 12, 20, 0.9);
  }

  /* 按内容定宽，不再被 flex 拉成半屏长条 */
  .abtn {
    flex: 0 0 auto;
    min-width: 76px;
    max-width: 150px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: #e8f1f8;
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    touch-action: none;
  }

  .abtn:active { transform: scale(0.97); }

  .abtn.on {
    background: rgba(0, 242, 254, 0.16);
    border-color: rgba(0, 242, 254, 0.5);
    color: var(--cy);
  }

  .abtn.warn {
    background: rgba(255, 51, 102, 0.14);
    border-color: rgba(255, 51, 102, 0.4);
    color: var(--rd);
  }

  .abtn.go {
    background: rgba(0, 230, 118, 0.16);
    border-color: rgba(0, 230, 118, 0.45);
    color: var(--gr);
  }

  .abtn.sel {
    padding: 8px 10px;
    font-family: Consolas, monospace;
    background: rgba(255, 179, 0, 0.12);
    border-color: rgba(255, 179, 0, 0.35);
    color: var(--am);
  }

  .hint {
    flex: 1 0 100%;
    font-size: 10px;
    color: var(--mut);
    line-height: 1.4;
    padding: 1px 2px 2px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── 提示条 ── */
  .toast {
    position: fixed;
    left: 50%;
    top: 44%;
    transform: translate(-50%, -50%) scale(0.96);
    background: rgba(0, 0, 0, 0.86);
    border: 1px solid var(--line);
    color: #fff;
    font-size: 13px;
    line-height: 1.6;
    padding: 13px 18px;
    border-radius: 14px;
    max-width: 82vw;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 80;
  }

  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @media (orientation: landscape) {
    main {
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 6px;
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-right: calc(6px + env(safe-area-inset-right));
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
      padding-left: calc(6px + env(safe-area-inset-left));
    }
    .left { gap: 6px; justify-content: flex-end; }
    /* 摇杆占满左半区并真正居中，底部按键/限速条浮在它上面 */
    .stick-zone { position: absolute; inset: 0; pointer-events: none; }
    .ctrl-row, .spd { position: relative; z-index: 2; }
    .stick { width: min(100%, 52vh, 34vw); pointer-events: auto; }
    .knob { font-size: 12px; }
    .btn { padding: 7px 12px; font-size: 11px; }
    /* 限速条占满左下栏：收窄两端文字，把长度都让给滑轨 */
    .spd { height: 32px; padding: 0 9px; gap: 7px; }
    .spd span { font-size: 9px; }
    .spd b { width: 32px; }

    /* 右侧两栏：上行左边车速/里程、右边罗盘；下行整宽行驶轨迹 */
    .right {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(96px, 0.82fr) minmax(110px, 1.18fr);
      gap: 6px;
    }
    .right > .stats { grid-column: 1; grid-row: 1; padding: 6px 10px; }
    .right > .compass-card { grid-column: 2; grid-row: 1; padding: 4px; }
    .right > .map-card { grid-column: 1 / -1; grid-row: 2; height: 100%; min-height: 0; }
    .stat b { font-size: 20px; }
    .compass-dial { width: min(100%, 34vh, 150px); }
    .compass-val .deg { font-size: 16px; }
    .compass-val .sub { font-size: 8px; }
  }

  /* 竖屏窄：状态小框换到按键下面一行，避免挤到 RUN / 清零 上 */
  @media (orientation: portrait) {
    .ctrl-row { flex-wrap: wrap; }
    .status-boxes { flex: 1 0 100%; justify-content: flex-start; }
  }

  /* 窄横屏：按钮再收一档，8 个仍排一行，地图不会被多挤掉一行 */
  @media (orientation: landscape) and (max-width: 720px) {
    .abtn { min-width: 64px; max-width: 120px; padding: 7px 9px; font-size: 11px; }
    .abtn.sel { padding: 7px 9px; }
  }
</style>
</head>
<body>

<main>
  <section class="left">
    <div class="stick-zone">
      <div class="stick" id="stick"><div class="knob" id="knob">停止</div></div>
    </div>
    <div class="ctrl-row">
      <div class="mini-btns">
        <button class="btn run" id="btnRun">RUN</button>
        <button class="btn" id="btnZero">清零</button>
      </div>
      <div class="status-boxes">
        <div class="pill" id="pill"><span class="dot"></span><span id="pillTxt">未连接</span></div>
        <span class="badge" id="hudState">STOP</span>
      </div>
    </div>
    <div class="spd">
      <span>限速</span>
      <input type="range" id="spd" min="10" max="100" step="5" value="50">
      <b id="spdVal">50%</b>
    </div>
  </section>

  <section class="right">
    <div class="card stats">
      <div class="stat"><span>车速 SPEED</span><p><b id="stSpeed">0.00</b><i>m/s</i></p></div>
      <div class="stat divider"><span>里程 DIST</span><p><b id="stDist">0.00</b><i>m</i></p></div>
    </div>
    <div class="card compass-card">
      <div class="compass-dial">
        <svg class="compass-needle-ring" id="compassRing" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5" />
          <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
          <text x="100" y="24" fill="#ff3366" font-size="12" font-weight="900" text-anchor="middle">N</text>
          <text x="100" y="184" fill="#8899a6" font-size="11" font-weight="700" text-anchor="middle">S</text>
          <text x="180" y="104" fill="#8899a6" font-size="11" font-weight="700" text-anchor="middle">E</text>
          <text x="20" y="104" fill="#8899a6" font-size="11" font-weight="700" text-anchor="middle">W</text>
          <polygon points="100,32 105,95 95,95" fill="#ff3366" />
          <polygon points="100,168 105,105 95,105" fill="#4a5568" />
          <circle cx="100" cy="100" r="7" fill="#00f2fe" />
          <circle cx="100" cy="100" r="3" fill="#ffffff" />
        </svg>
        <div class="compass-val">
          <div class="deg" id="cmpYaw">+0°</div>
          <div class="sub">航向角 YAW</div>
        </div>
      </div>
    </div>
    <div class="card map-card" id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div class="map-tip" id="mapTip">点击放大 · 自动驾驶</div>
    </div>
  </section>
</main>

<!-- 全屏自动驾驶 -->
<div class="modal" id="modal">
  <div class="modal-head">
    <b>自动驾驶</b>
    <span class="st" id="autoState">待命</span>
    <button class="xbtn" id="modalClose">✕</button>
  </div>

  <div class="modal-map" id="modalHost"></div>

  <div class="modal-ctrl" id="autoBar">
    <button class="abtn sel" id="autoSpeed">速度 42%</button>
    <button class="abtn" id="btnCapture">采集轨迹</button>
    <button class="abtn go" id="btnReplay">回放原路</button>
    <button class="abtn go" id="btnReturn">原路返回</button>
    <button class="abtn" id="btnLoop">往返循环</button>
    <button class="abtn on" id="btnDraw">✏️ 绘制路线</button>
    <button class="abtn" id="btnReverse">转向反向</button>
    <button class="abtn warn" id="btnAutoStop">停止</button>
    <div class="hint" id="autoHint">点击「回放原路」沿当前轨迹行驶；「往返循环」会在两端自动折返，一直来回跑。</div>
  </div>

  <div class="modal-ctrl" id="drawBar" style="display:none;">
    <button class="abtn" id="btnUndo">撤销</button>
    <button class="abtn" id="btnClearDraw">清空</button>
    <button class="abtn go" id="btnDrawRun">开始循迹</button>
    <button class="abtn warn" id="btnDrawCancel">取消</button>
    <div class="hint" id="drawHint">在地图上按住并拖动，画出想让小车走的路线（可多笔）。画完点「开始循迹」。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
 * 手机端：手柄遥控 + 航位推算轨迹 + 上位机自动驾驶（回放 / 返回 / 往返 / 手绘）
 *
 * 通信全部走电脑上的 web_server.py HTTP 桥：
 *   POST /api/send      下发 !DIR:mask# / !D:L,R# / 单字符
 *   GET  /api/telemetry 读回 车速 / 里程 / 航向 / 状态（20Hz）
 *
 * 自动驾驶控制环和电脑端是同一套：每收一帧遥测算一次纯追踪输出，
 * 回一条 !D:<L>,<R>#（千分比）。两端不要同时开自动驾驶。
 * ══════════════════════════════════════════════════════════════════════════ */

const DIR_FWD = 1, DIR_REV = 2, DIR_LEFT = 4, DIR_RIGHT = 8;

/* ── DOM ── */
const $ = (id) => document.getElementById(id);
const stick = $('stick'), knob = $('knob');
const pill = $('pill'), pillTxt = $('pillTxt');
const toastEl = $('toast');
const mapWrap = $('mapWrap');
const mapCanvas = $('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');
const compassRing = $('compassRing');
const modal = $('modal'), modalHost = $('modalHost');

/* ── 全局状态 ── */
const S = { port: false, online: false, speed: 0, dist: 0, yaw: 0, state: 0, pct: 50 };

/* ── 轨迹（航位推算） ── */
const T = {
  pts: [{ x: 0, y: 0 }],
  lastDist: null,
  yaw: 0,
  minX: 0, maxX: 0, minY: 0, maxY: 0,
  w: 1, h: 1, dpr: 1,
  k: 0.5, cx: 0, cy: 0, fit: true
};

/* ── 自动驾驶 ── */
const A = {
  route: [],
  dir: 1,
  active: false,
  state: 'idle',          /* idle | align | track | pause */
  loop: false,
  speed: 42,
  look: 520,
  exact: false,          /* 手绘路线：小前视 + 窄窗口，严格贴线 */
  deadline: 0,           /* 按路线长度/速度估算的超时时刻 */
  path: [],
  idx: 0,
  outL: 0, outR: 0,
  lastYaw: 0, yawRate: 0, lastTime: 0,
  alignCnt: 0, largeCnt: 0,
  t0: 0, pauseUntil: 0,
  turnDir: 1
};

/* ── 绘制 ── */
const D = { on: false, strokes: [], cur: null, downX: 0, downY: 0, moved: false };

/* ══════════════════════ 基础工具 ══════════════════════ */
function toast(msg, ms) {
  toastEl.innerHTML = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
}

function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } }

async function send(cmd) {
  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: cmd })
    });
    return true;
  } catch (e) { return false; }
}

/* ══════════════════════ 摇杆 ══════════════════════ */
let mask = 0, dragging = false, pointerId = null, lastTx = 0;

const SECTOR = 0.34;

function maskName(m) {
  if (m === 0) return '停止';
  const v = (m & DIR_FWD) ? '前' : ((m & DIR_REV) ? '后' : '');
  const h = (m & DIR_LEFT) ? '左' : ((m & DIR_RIGHT) ? '右' : '');
  if (v && h) return v + h;
  if (v) return v + '进';
  if (h) return h + '转';
  return '停止';
}

function applyKnob(dx, dy) {
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function onStickMove(e) {
  if (!dragging || e.pointerId !== pointerId) return;
  const r = stick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2 - r.width * 0.20;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  applyKnob(dx, dy);

  const nx = dx / max, ny = dy / max;
  let m = 0;
  if (ny < -SECTOR) m |= DIR_FWD;
  if (ny > SECTOR) m |= DIR_REV;
  if (nx < -SECTOR) m |= DIR_LEFT;
  if (nx > SECTOR) m |= DIR_RIGHT;

  if (m !== mask) {
    mask = m;
    knob.innerText = maskName(m);
    knob.classList.toggle('live', m !== 0);
    sendMask();
    if (m !== 0 && A.active) autoAbort('人工接管手柄');
    if (m === 0) vibrate(8);
  }
}

function sendMask() {
  lastTx = Date.now();
  send(`!DIR:${mask}#`);
}

function releaseStick() {
  if (!dragging) return;
  dragging = false;
  pointerId = null;
  applyKnob(0, 0);
  knob.innerText = '停止';
  knob.classList.remove('live');
  if (mask !== 0) { mask = 0; sendMask(); }
}

stick.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  dragging = true;
  pointerId = e.pointerId;
  try { stick.setPointerCapture(e.pointerId); } catch (err) { /* 老 Safari */ }
  onStickMove(e);
});
stick.addEventListener('pointermove', onStickMove);
stick.addEventListener('pointerup', releaseStick);
stick.addEventListener('pointercancel', releaseStick);
stick.addEventListener('lostpointercapture', releaseStick);

/* ══════════════════════ 按钮 ══════════════════════
 * 横屏布局取消了急停大按钮：松开摇杆本身就会发 !DIR:0# 停车，
 * 自动驾驶面板里也仍有「停止」。这里保留一个函数供长按 RUN 兜底。 */
function emergencyStop() {
  releaseStick();
  mask = 0;
  applyKnob(0, 0);
  knob.innerText = '停止';
  knob.classList.remove('live');
  autoAbort('急停');
  send('!DIR:0#');
  setTimeout(() => send(' '), 20);
  vibrate(30);
  toast('已急停', 1200);
}

/* 短按 RUN = 启停切换；长按 650ms = 急停（急停大按钮取消后的兜底） */
let runHoldTimer = null, runHeld = false;
const btnRun = $('btnRun');
btnRun.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  runHeld = false;
  try { btnRun.setPointerCapture(e.pointerId); } catch (err) { /* 老 Safari */ }
  runHoldTimer = setTimeout(() => {
    runHeld = true;
    runHoldTimer = null;
    emergencyStop();
  }, 650);
});
btnRun.addEventListener('pointerup', () => {
  if (runHoldTimer) { clearTimeout(runHoldTimer); runHoldTimer = null; }
  if (runHeld) { runHeld = false; return; }
  send('1');
  vibrate(12);
  toast('启停切换（S1）', 1200);
});
btnRun.addEventListener('pointercancel', () => {
  if (runHoldTimer) { clearTimeout(runHoldTimer); runHoldTimer = null; }
  runHeld = false;
});

$('btnZero').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  send('2');
  trajReset();
  vibrate(12);
  toast('里程 / 航向已清零，轨迹回到原点', 1600);
});

const spd = $('spd'), spdVal = $('spdVal');
spd.addEventListener('input', () => { spdVal.innerText = spd.value + '%'; });
spd.addEventListener('change', () => {
  vibrate(8);
  send(`!SET:SPD=${spd.value}#`);
});

/* ══════════════════════ 轨迹 / 地图 ══════════════════════ */
function trajReset() {
  T.pts = [{ x: 0, y: 0 }];
  T.lastDist = null;
  T.minX = T.maxX = T.minY = T.maxY = 0;
  T.fit = true;
}

function carPos() { return T.pts[T.pts.length - 1] || { x: 0, y: 0 }; }

function feedTelemetry(d) {
  const dist = (d.dist || 0) * 1000;
  const yaw = (((d.yaw || 0) % 360) + 360) % 360;
  T.yaw = yaw;
  if (T.lastDist === null) { T.lastDist = dist; return; }
  const ds = dist - T.lastDist;
  T.lastDist = dist;
  if (!isFinite(ds) || Math.abs(ds) > 300) return;   /* 里程清零/跳变：只断笔 */
  if (ds === 0) return;

  const th = yaw * Math.PI / 180;
  const last = carPos();
  const x = last.x + ds * Math.sin(th);
  const y = last.y + ds * Math.cos(th);
  T.pts.push({ x, y });
  if (x < T.minX) T.minX = x;
  if (x > T.maxX) T.maxX = x;
  if (y < T.minY) T.minY = y;
  if (y > T.maxY) T.maxY = y;
  if (T.pts.length > 9000) {
    T.pts.splice(0, 3000);
    T.minX = T.maxX = T.pts[0].x;
    T.minY = T.maxY = T.pts[0].y;
    for (const p of T.pts) {
      if (p.x < T.minX) T.minX = p.x;
      if (p.x > T.maxX) T.maxX = p.x;
      if (p.y < T.minY) T.minY = p.y;
      if (p.y > T.maxY) T.maxY = p.y;
    }
  }
}

function resizeMap() {
  const r = mapWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  if (w === T.w && h === T.h && mapCanvas.width === Math.round(w * dpr)) return;
  T.w = w; T.h = h; T.dpr = dpr;
  mapCanvas.width = Math.round(w * dpr);
  mapCanvas.height = Math.round(h * dpr);
  mapCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* 世界坐标 → 屏幕坐标（与电脑端同一套公式） */
function sx(wx) { return T.w / 2 + (wx - T.cx) * T.k; }
function sy(wy) { return T.h / 2 - (wy - T.cy) * T.k; }
function wxOf(px) { return (px - T.w / 2) / T.k + T.cx; }
function wyOf(py) { return T.cy - (py - T.h / 2) / T.k; }

function updateView() {
  if (!T.fit) return;
  const pad = 18;
  const spanX = Math.max(900, T.maxX - T.minX);
  const spanY = Math.max(900, T.maxY - T.minY);
  const kTarget = Math.min((T.w - pad * 2) / spanX, (T.h - pad * 2) / spanY);
  if (!isFinite(kTarget) || kTarget <= 0) return;
  const kNew = Math.min(kTarget, 1.6);
  /* 需要缩小视野时必须立刻跟上，否则轨迹会长出屏幕；
   * 需要放大时慢慢来，避免画面一抖一抖。 */
  T.k = (kNew < T.k) ? kNew : T.k + (kNew - T.k) * 0.10;
  const cxT = (T.minX + T.maxX) / 2;
  const cyT = (T.minY + T.maxY) / 2;
  T.cx += (cxT - T.cx) * 0.25;
  T.cy += (cyT - T.cy) * 0.25;
}

function drawGrid() {
  const c = mapCtx;
  c.strokeStyle = 'rgba(255,255,255,0.045)';
  c.lineWidth = 1;
  const step = 500 * T.k;
  if (step > 8) {
    const ox = sx(0) % step, oy = sy(0) % step;
    for (let x = ox; x < T.w; x += step) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, T.h); c.stroke(); }
    for (let y = oy; y < T.h; y += step) { c.beginPath(); c.moveTo(0, y); c.lineTo(T.w, y); c.stroke(); }
  }
}

function drawPoly(pts, color, width, dash) {
  if (!pts || pts.length < 2) return;
  const c = mapCtx;
  c.save();
  c.strokeStyle = color;
  c.lineWidth = width;
  c.lineJoin = 'round';
  c.lineCap = 'round';
  if (dash) c.setLineDash(dash);
  c.beginPath();
  c.moveTo(sx(pts[0].x), sy(pts[0].y));
  for (let i = 1; i < pts.length; i++) c.lineTo(sx(pts[i].x), sy(pts[i].y));
  c.stroke();
  c.restore();
}

function drawCar() {
  const p = carPos();
  const c = mapCtx;
  c.save();
  c.translate(sx(p.x), sy(p.y));
  c.rotate(T.yaw * Math.PI / 180);
  c.fillStyle = '#00f2fe';
  c.shadowColor = '#00f2fe';
  c.shadowBlur = 10;
  c.beginPath();
  c.moveTo(0, -9);
  c.lineTo(6.5, 7);
  c.lineTo(0, 4);
  c.lineTo(-6.5, 7);
  c.closePath();
  c.fill();
  c.restore();
}

function drawFlag(p, color) {
  if (!p) return;
  const c = mapCtx;
  const x = sx(p.x), y = sy(p.y);
  c.save();
  c.strokeStyle = color;
  c.fillStyle = color;
  c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 14); c.stroke();
  c.beginPath(); c.moveTo(x, y - 14); c.lineTo(x + 10, y - 11); c.lineTo(x, y - 8); c.closePath(); c.fill();
  c.restore();
}

function renderMap() {
  resizeMap();
  updateView();
  const c = mapCtx;
  c.clearRect(0, 0, T.w, T.h);
  drawGrid();

  /* 走过的轨迹 */
  drawPoly(T.pts, 'rgba(0, 242, 254, 0.55)', 1.6);

  /* 规范路线（起点→终点） */
  if (A.route.length > 1) {
    drawPoly(A.route, 'rgba(0, 230, 118, 0.55)', 2, [5, 4]);
    drawFlag(A.route[A.route.length - 1], '#00e676');
    drawFlag(A.route[0], '#8899a6');
  }

  /* 手绘中的线 */
  for (const st of D.strokes) drawPoly(st, '#ffb300', 2.6);
  if (D.cur) drawPoly(D.cur, '#ffb300', 2.6);

  drawCar();

  /* 比例尺 */
  c.fillStyle = 'rgba(255,255,255,0.45)';
  c.font = '10px Consolas, monospace';
  c.textAlign = 'left';
  const barMM = 1000, barPx = barMM * T.k;
  if (barPx > 20 && barPx < T.w * 0.6) {
    const y0 = T.h - 12;
    c.strokeStyle = 'rgba(255,255,255,0.45)';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(10, y0); c.lineTo(10 + barPx, y0); c.stroke();
    c.fillText('1 m', 12 + barPx, y0 + 3);
  }
}

/* ══════════════════════ 罗盘（与电脑端同一套旋转刻度环） ══════════════════════ */
let g_compassYaw;
function updateCompass(yaw) {
  if (typeof g_compassYaw === 'undefined') {
    g_compassYaw = yaw;
  } else {
    /* 走最短几何路径，跨越 ±180° 时不会整圈倒转 */
    const diff = ((yaw - g_compassYaw + 180) % 360 + 360) % 360 - 180;
    g_compassYaw += diff;
  }
  compassRing.style.transform = `rotate(${g_compassYaw}deg)`;
  $('cmpYaw').innerText = (yaw >= 0 ? '+' : '') + yaw.toFixed(0) + '°';
}

/* 摇杆在左半区正中取正方形：先扣掉底部按键条和限速条的高度，
 * 再横屏收一点，保证既不被裁切也不压住按钮。 */
function sizeStick() {
  const zone = document.querySelector('.stick-zone');
  const row = document.querySelector('.ctrl-row');
  const bar = document.querySelector('.spd');
  if (!zone || !row || !bar) return;
  const landscape = window.innerWidth > window.innerHeight;
  /* 横屏时 zone 铺满左半区，要扣掉底部两条；竖屏时 zone 本就是剩余空间，不再扣 */
  const reserved = landscape ? (row.offsetHeight + bar.offsetHeight + 18) : 0;
  const lim = Math.min(zone.clientWidth, zone.clientHeight - reserved);
  if (lim <= 0) return;
  const f = landscape ? 0.68 : 0.92;
  stick.style.width = Math.max(96, Math.round(lim * f)) + 'px';
}

/* ══════════════════════ 自动驾驶核心 ══════════════════════
 * 与电脑端同一套：纯追踪前视 + 横向偏距软补偿 + 角速度反舵阻尼。
 * 差别只在通信：这里全走 HTTP 桥。
 */
function dist2(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

/* 轨迹稀释成路点（约 60mm 一点） */
function routeFromTraj() {
  const src = T.pts;
  if (src.length < 10) return null;
  const out = [];
  let lx = null, ly = null;
  for (let i = 0; i < src.length; i++) {
    const p = src[i];
    if (lx === null || Math.hypot(p.x - lx, p.y - ly) >= 60 || i === src.length - 1) {
      out.push({ x: p.x, y: p.y });
      lx = p.x; ly = p.y;
    }
  }
  return out.length >= 3 ? out : null;
}

function routeLen(pts) {
  let l = 0;
  for (let i = 1; i < pts.length; i++) l += dist2(pts[i], pts[i - 1]);
  return l;
}

function setAutoState(txt) {
  const el = $('autoState');
  if (el) el.innerText = txt;
}

function autoAbort(reason) {
  if (!A.active) return;
  A.active = false;
  A.state = 'idle';
  A.path = [];
  setAutoState('已接管');
  if (reason) toast(reason + '，自动退出', 1500);
}

function buildPath(route) {
  const cur = carPos();
  const path = [];
  if (dist2(cur, route[0]) > 70) path.push({ x: cur.x, y: cur.y });
  for (const p of route) path.push({ x: p.x, y: p.y });
  A.path = path;
  A.idx = 0;
  A.outL = 0;
  A.outR = 0;
  A.lastYaw = T.yaw;
  A.yawRate = 0;
  A.lastTime = 0;
  A.alignCnt = 0;
  A.largeCnt = 0;
  A.t0 = Date.now();
}

function startDrive(dir, exact) {
  if (!A.route.length) { toast('还没有路线：先「采集轨迹」或「绘制路线」'); return; }
  A.active = true;
  A.dir = dir;
  A.exact = !!exact;
  const route = (dir > 0) ? A.route.slice() : A.route.slice().reverse();
  buildPath(route);
  /* 手绘路线用小前视贴着线走；录制路线用大前视抑制画龙。
   * 短路线配大前视会一眼锁到终点，车直接抄近路冲过去。 */
  A.look = A.exact
    ? Math.max(140, Math.min(240, 100 + A.speed * 1.8))
    : 420 + A.speed * 2.5;
  A.deadline = Date.now() + 60000 + routeLen(route) / Math.max(120, A.speed * 5.5) * 1000;
  /* 车头离首段方向太远才原地掉头，否则直接贴线，省一次停顿 */
  A.state = 'track';
  {
    const q0 = A.path[0], q1 = A.path[Math.min(3, A.path.length - 1)];
    if (q1 && (q1.x !== q0.x || q1.y !== q0.y)) {
      const want0 = Math.atan2(q1.x - q0.x, q1.y - q0.y) * 180 / Math.PI;
      let e0 = want0 - T.yaw;
      while (e0 > 180) e0 -= 360;
      while (e0 < -180) e0 += 360;
      if (Math.abs(e0) > 35) A.state = 'align';
    } else {
      A.state = 'align';
    }
  }
  const km = (routeLen(route) / 1000).toFixed(2);
  setAutoState((dir > 0 ? '前往终点 ' : '返回起点 ') + km + 'm');
  send('!DIR:0#');
  vibrate(12);
}

function arrive() {
  if (A.loop) {
    A.dir = -A.dir;
    A.state = 'pause';
    A.pauseUntil = Date.now() + 1200;
    send('!D:0,0#');
    setAutoState(A.dir > 0 ? '折返 → 前往终点' : '折返 → 返回起点');
    toast(A.dir > 0 ? '到达起点，1.2s 后再次前往终点' : '到达终点，1.2s 后原路返回', 1600);
    return;
  }
  A.active = false;
  A.state = 'idle';
  A.path = [];
  send('!D:0,0#');
  send(' ');
  setAutoState('已到达');
  toast('已到达终点', 1600);
}

function autoStep() {
  if (!A.active) return;

  if (A.state === 'pause') {
    if (Date.now() < A.pauseUntil) return;
    const route = (A.dir > 0) ? A.route.slice() : A.route.slice().reverse();
    buildPath(route);
    A.state = 'align';
    setAutoState(A.dir > 0 ? '前往终点…' : '返回起点…');
    return;
  }

  const path = A.path;
  if (path.length < 2) { A.active = false; return; }
  const p = carPos();

  /* 1) 最近路点（限窗，避免抄近道）。手绘路线把窗口再收紧，
   *    否则最近点会跳到前面几段去，车立刻切直线过去。 */
  const from = Math.max(0, A.idx - (A.exact ? 3 : 6));
  const to = Math.min(path.length, A.idx + (A.exact ? 14 : 45));
  let best = A.idx, bd = Infinity;
  for (let i = from; i < to; i++) {
    const dx = path[i].x - p.x, dy = path[i].y - p.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bd) { bd = d2; best = i; }
  }
  A.idx = best;

  /* 2) 前视点 */
  let j = best, acc = 0;
  while (j < path.length - 1 && acc < A.look) {
    acc += dist2(path[j + 1], path[j]);
    j++;
  }

  /* 3) 到点判定 */
  const endP = path[path.length - 1];
  const dEnd = dist2(endP, p);
  if (dEnd < (A.exact ? 60 : 80)) { arrive(); return; }

  /* 超时按路线长度和速度估算，低速跑长线不会被 150s 硬砍 */
  if (A.deadline && Date.now() > A.deadline) {
    A.active = false; A.state = 'idle'; A.path = [];
    send('!D:0,0#'); send(' ');
    setAutoState('超时停车');
    toast('超出预计用时未到点，已强制停车', 2000);
    return;
  }

  /* 4) 目标方位与航向误差 */
  let ldx = path[j].x - p.x, ldy = path[j].y - p.y;
  if (Math.hypot(ldx, ldy) < 15 && j < path.length - 1) {
    ldx = path[j + 1].x - p.x;
    ldy = path[j + 1].y - p.y;
  }
  const want = Math.atan2(ldx, ldy) * 180 / Math.PI;
  let err = want - T.yaw;
  while (err > 180) err -= 360;
  while (err < -180) err += 360;
  const aerr = Math.abs(err);

  /* 5) 原地对齐阶段 */
  if (A.state === 'align') {
    if (aerr <= 18) {
      A.alignCnt++;
      if (A.alignCnt >= 2) {
        A.state = 'track';
        A.lastYaw = T.yaw;
        A.yawRate = 0;
        A.lastTime = 0;
        A.outL = 0;
        A.outR = 0;
      }
    } else {
      A.alignCnt = 0;
    }
    if (A.state === 'align') {
      const sgn = err > 0 ? 1 : -1;
      /* 掉头功率跟当前设定速度走：42%→23%，60%→33%，25%→14% */
      const pwr = Math.max(14, Math.min(46, A.speed * 0.55)) + Math.min(13, aerr * 0.18);
      const tl = A.turnDir * sgn * pwr;
      const tr = -A.turnDir * sgn * pwr;
      A.outL = A.outL * 0.5 + tl * 0.5;
      A.outR = A.outR * 0.5 + tr * 0.5;
      send(`!D:${Math.round(A.outL * 10)},${Math.round(A.outR * 10)}#`);
      setAutoState(`掉头中 · 差 ${aerr.toFixed(0)}°`);
      return;
    }
  }

  /* 6) 横向偏距（软补偿） */
  let pA = path[best];
  let pB = (best < path.length - 1) ? path[best + 1] : path[best];
  if (best === path.length - 1 && best > 0) { pA = path[best - 1]; pB = path[best]; }
  const segDx = pB.x - pA.x, segDy = pB.y - pA.y;
  const segLen = Math.hypot(segDx, segDy);
  let crossDist = 0;
  if (segLen > 1) crossDist = (segDx * (p.y - pA.y) - segDy * (p.x - pA.x)) / segLen;

  let crossBias = 0;
  if (Math.abs(crossDist) > 25) {
    const excess = Math.abs(crossDist) - 25;
    /* 手绘路线要贴线，偏距补偿放宽一点 */
    crossBias = Math.sign(crossDist) * Math.min(A.exact ? 10 : 6, excess * (A.exact ? 0.06 : 0.04));
  }

  let fusedErr = err + crossBias;
  while (fusedErr > 180) fusedErr -= 360;
  while (fusedErr < -180) fusedErr += 360;

  if (Math.abs(err) > 85) {
    if (++A.largeCnt > 5) {
      A.state = 'align';
      A.largeCnt = 0;
      return;
    }
  } else {
    A.largeCnt = 0;
  }

  /* 7) PD + 角速度阻尼 */
  const now = Date.now();
  const dt = Math.max(0.02, Math.min(0.15, (A.lastTime ? (now - A.lastTime) : 50) / 1000));
  A.lastTime = now;
  let dYaw = T.yaw - A.lastYaw;
  while (dYaw > 180) dYaw -= 360;
  while (dYaw < -180) dYaw += 360;
  const rawRate = dYaw / dt;
  A.lastYaw = T.yaw;
  A.yawRate = A.yawRate * 0.5 + rawRate * 0.5;

  let turn = 0;
  if (Math.abs(fusedErr) <= 1.2 && Math.abs(crossDist) <= 18) {
    turn = 0;
  } else {
    /* 增益随速度归一化：同样曲率需要的轮速差 ∝ v，换速度不用重新整定 */
    const kSpd = Math.max(0.55, Math.min(1.75, A.speed / 42));
    turn = 0.38 * kSpd * fusedErr - 0.045 * kSpd * A.yawRate;
  }

  /* 8) 速度规划与输出 */
  const aFused = Math.abs(fusedErr);
  let remain = dist2(path[j], p);
  for (let i = j; i < path.length - 1; i++) remain += dist2(path[i + 1], path[i]);
  let v = A.speed * (1.0 - 0.25 * Math.min(1.0, aFused / 45.0));
  v *= (0.60 + 0.40 * Math.min(1.0, remain / 450.0));
  /* 下限跟着设定速度走，别把用户调的低速硬顶回 30% */
  const vFloor = Math.max(14, Math.min(30, A.speed * 0.55));
  if (v < vFloor) v = vFloor;

  const turnMax = Math.max(10, A.speed - 16);
  turn = Math.max(-turnMax, Math.min(turnMax, turn));

  const tl = v + A.turnDir * turn;
  const tr = v - A.turnDir * turn;
  A.outL = (A.outL || v) * 0.30 + tl * 0.70;
  A.outR = (A.outR || v) * 0.30 + tr * 0.70;

  const oL = Math.max(-100, Math.min(100, A.outL));
  const oR = Math.max(-100, Math.min(100, A.outR));
  send(`!D:${Math.round(oL * 10)},${Math.round(oR * 10)}#`);
  setAutoState((A.dir > 0 ? '去程 ' : '返程 ') +
    (remain / 1000).toFixed(2) + 'm · 偏' + fusedErr.toFixed(1) + '°');
}

/* ══════════════════════ 手绘路线 ══════════════════════ */
function drawFlatten() {
  const all = [];
  for (const st of D.strokes) for (const p of st) all.push(p);
  return all;
}

/* 屏幕坐标轨迹 → 世界坐标 + 按 60mm 重采样 */
function drawnRoute() {
  const flat = drawFlatten();
  if (flat.length < 2) return null;
  const wpts = flat.map(p => ({ x: wxOf(p.x), y: wyOf(p.y) }));
  const out = [wpts[0]];
  for (let i = 1; i < wpts.length; i++) {
    if (dist2(wpts[i], out[out.length - 1]) >= 60) out.push(wpts[i]);
  }
  const last = wpts[wpts.length - 1];
  if (dist2(last, out[out.length - 1]) > 5) out.push(last);
  return out.length >= 2 ? out : null;
}

function drawModeOn(on) {
  D.on = on;
  D.strokes = [];
  D.cur = null;
  $('drawBar').style.display = on ? 'flex' : 'none';
  $('autoBar').style.display = on ? 'none' : 'flex';
  $('btnDraw').classList.toggle('on', on);
  if (on) {
    T.fit = false;                       /* 画的时候地图不许动 */
    $('drawHint').innerText = '在地图上按住并拖动，画出想让小车走的路线（可多笔）。画完点「开始循迹」。';
    if (!modal.classList.contains('show')) { modal.classList.add('show'); moveMapTo(modalHost); }
    toast('绘制模式：拖动地图画线', 2000);
  } else {
    T.fit = true;
  }
}

/* 把小地图搬到全屏面板里 / 搬回右列。
 * 右列横屏是两栏 grid，地图靠 CSS 显式放在第 2 行整宽，
 * 所以这里直接 append 即可，不依赖兄弟节点顺序。 */
function moveMapTo(parent) {
  if (!parent) return;
  parent.appendChild(mapWrap);
  requestAnimationFrame(() => { resizeMap(); renderMap(); });
}

/* ══════════════════════ 地图交互（点击放大 / 绘制） ══════════════════════ */
mapWrap.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = mapWrap.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;

  if (D.on && modal.classList.contains('show')) {
    try { mapWrap.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    D.cur = [{ x: px, y: py }];
    return;
  }

  D.downX = e.clientX;
  D.downY = e.clientY;
  D.moved = false;
});

mapWrap.addEventListener('pointermove', (e) => {
  const r = mapWrap.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;

  if (D.on && modal.classList.contains('show')) {
    if (!D.cur) return;
    const last = D.cur[D.cur.length - 1];
    if (Math.hypot(px - last.x, py - last.y) < 4) return;
    D.cur.push({ x: px, y: py });
    return;
  }

  if (Math.hypot(e.clientX - D.downX, e.clientY - D.downY) > 8) D.moved = true;
});

function endMapPointer(e) {
  const r = mapWrap.getBoundingClientRect();

  if (D.on && modal.classList.contains('show')) {
    if (D.cur && D.cur.length > 1) D.strokes.push(D.cur);
    D.cur = null;
    return;
  }

  if (!D.moved) {
    /* 小地图点一下 = 打开全屏自动驾驶 */
    if (!modal.classList.contains('show')) openAuto();
  }
}

mapWrap.addEventListener('pointerup', endMapPointer);
mapWrap.addEventListener('pointercancel', () => { D.cur = null; });

/* ══════════════════════ 全屏面板 ══════════════════════ */
function openAuto() {
  modal.classList.add('show');
  moveMapTo(modalHost);
  renderMap();
  setAutoState(A.active ? '运行中' : '待命');
}

function closeAuto() {
  if (D.on) { D.on = false; $('drawBar').style.display = 'none'; $('autoBar').style.display = 'flex'; $('btnDraw').classList.remove('on'); }
  T.fit = true;
  modal.classList.remove('show');
  moveMapTo(document.querySelector('.right'));
}

$('modalClose').addEventListener('click', closeAuto);

/* ══════════════════════ 自动驾驶按钮 ══════════════════════ */
const SPD_STEPS = [35, 42, 50, 60];
let spdIdx = 1;
$('autoSpeed').addEventListener('click', () => {
  spdIdx = (spdIdx + 1) % SPD_STEPS.length;
  A.speed = SPD_STEPS[spdIdx];
  A.look = 420 + A.speed * 2.5;
  $('autoSpeed').innerText = '速度 ' + A.speed + '%';
  lsSet('auto_speed', String(A.speed));
  vibrate(8);
});
(function () {
  const v = parseInt(lsGet('auto_speed') || '', 10);
  if (SPD_STEPS.indexOf(v) >= 0) {
    spdIdx = SPD_STEPS.indexOf(v);
    A.speed = v;
    A.look = 420 + A.speed * 2.5;
    $('autoSpeed').innerText = '速度 ' + A.speed + '%';
  }
})();

/* 转向极性：和电脑端共用同一个 localStorage 键 */
(function () {
  const s = parseInt(lsGet('traj_steer_dir') || '', 10);
  if (s === 1 || s === -1) A.turnDir = s;
  $('btnReverse').classList.toggle('on', A.turnDir === -1);
})();

$('btnReverse').addEventListener('click', () => {
  A.turnDir = -A.turnDir;
  lsSet('traj_steer_dir', String(A.turnDir));
  $('btnReverse').classList.toggle('on', A.turnDir === -1);
  toast('转向极性：' + (A.turnDir > 0 ? '正常' : '反向') + '（两端同步）', 1600);
});

$('btnCapture').addEventListener('click', () => {
  const r = routeFromTraj();
  if (!r) { toast('轨迹太短，先手动开一段再采集'); return; }
  A.route = r;
  toast(`已采集 ${r.length} 个路点 / ${(routeLen(r) / 1000).toFixed(2)} m`, 2200);
  setAutoState('已采集路线');
});

$('btnReplay').addEventListener('click', () => {
  if (A.active) { stopAuto(); return; }
  if (!A.route.length) {
    const r = routeFromTraj();
    if (!r) { toast('轨迹太短：先手动开一段，或手绘路线'); return; }
    A.route = r;
  }
  startDrive(1);
});

$('btnReturn').addEventListener('click', () => {
  if (A.active) { stopAuto(); return; }
  if (!A.route.length) {
    const r = routeFromTraj();
    if (!r) { toast('轨迹太短：先手动开一段，或手绘路线'); return; }
    A.route = r;
  }
  startDrive(-1);
});

$('btnLoop').addEventListener('click', () => {
  A.loop = !A.loop;
  $('btnLoop').classList.toggle('on', A.loop);
  $('autoHint').innerText = A.loop
    ? '往返循环已开启：到终点自动掉头返回，到起点再自动前往终点，直到点「停止」。'
    : '点击「回放原路」沿当前轨迹行驶；「往返循环」会在两端自动折返，一直来回跑。';
  toast(A.loop ? '往返循环：开' : '往返循环：关', 1500);
  if (A.loop && !A.active) {
    if (!A.route.length) {
      const r = routeFromTraj();
      if (r) A.route = r;
    }
    if (A.route.length) {
      startDrive(1);
    } else {
      A.loop = false;
      $('btnLoop').classList.remove('on');
      toast('还没有路线：先手动开一段再「采集轨迹」，或直接「绘制路线」', 2400);
    }
  }
});

function stopAuto() {
  A.active = false;
  A.state = 'idle';
  A.path = [];
  send('!D:0,0#');
  send(' ');
  setAutoState('待命');
  vibrate(20);
}

$('btnAutoStop').addEventListener('click', () => { stopAuto(); toast('自动驾驶已停止', 1400); });

$('btnDraw').addEventListener('click', () => { drawModeOn(true); });
$('btnDrawCancel').addEventListener('click', () => { drawModeOn(false); });
$('btnUndo').addEventListener('click', () => {
  if (D.cur) { D.cur = null; return; }
  D.strokes.pop();
  $('drawHint').innerText = D.strokes.length ? `已画 ${D.strokes.length} 笔，可继续画或开始循迹。` : '在地图上按住并拖动，画出想让小车走的路线（可多笔）。';
});
$('btnClearDraw').addEventListener('click', () => {
  D.strokes = []; D.cur = null;
  $('drawHint').innerText = '已清空，重新画一条。';
});
$('btnDrawRun').addEventListener('click', () => {
  const r = drawnRoute();
  if (!r) { toast('还没画线：先在地图上拖一条'); return; }
  A.route = r;
  A.loop = false;
  $('btnLoop').classList.remove('on');
  drawModeOn(false);
  startDrive(1, true);
  toast(`开始循迹：${r.length} 个路点 / ${(routeLen(r) / 1000).toFixed(2)} m · 从当前位置贴线走完全程`, 2200);
});

/* ══════════════════════ 遥测轮询 ══════════════════════ */
let pollTimer = null;

async function pollTelemetry() {
  let fast = A.active || modal.classList.contains('show');
  try {
    const res = await fetch('/api/telemetry');
    const j = await res.json();
    S.port = !!j.connected;
    S.online = !!j.online;

    if (S.online) {
      pill.className = 'pill on';
      pillTxt.innerText = '在线 ' + Math.round(j.age_ms || 0) + 'ms';
      const d = j.data || {};
      S.speed = d.speed || 0;
      S.dist = d.dist || 0;
      S.state = d.state || 0;
      feedTelemetry(d);

      $('stSpeed').innerText = S.speed.toFixed(2);
      $('stDist').innerText = S.dist.toFixed(2);
      updateCompass(d.yaw || 0);

      const st = $('hudState');
      if (S.state === 1) { st.innerText = 'RUN'; st.className = 'badge run'; }
      else if (S.state === 3) { st.innerText = 'BRAKE'; st.className = 'badge brake'; }
      else { st.innerText = 'STOP'; st.className = 'badge'; }

      if (A.active) autoStep();
    } else if (S.port) {
      pill.className = 'pill';
      pillTxt.innerText = '等待小车…';
    } else {
      pill.className = 'pill';
      pillTxt.innerText = '电脑未连串口';
    }
  } catch (e) {
    pill.className = 'pill';
    pillTxt.innerText = '电脑服务离线';
  }

  /* 自动驾驶时 20Hz 轮询，其它时候 10Hz */
  pollTimer = setTimeout(pollTelemetry, (A.active || fast) ? 50 : 100);
}

/* ══════════════════════ 渲染循环 ══════════════════════ */
let lastDraw = 0;
function loop() {
  const now = performance.now();
  if (now - lastDraw > 50) {
    lastDraw = now;
    renderMap();
  }
  requestAnimationFrame(loop);
}

/* ══════════════════════ 生命周期 ══════════════════════ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    releaseStick();
    if (A.active) autoAbort('页面切到后台');
  }
});
window.addEventListener('blur', releaseStick);
window.addEventListener('resize', () => { resizeMap(); sizeStick(); });
window.addEventListener('orientationchange', () => {
  setTimeout(() => { resizeMap(); sizeStick(); }, 200);
});
if (window.ResizeObserver) {
  new ResizeObserver(() => sizeStick()).observe(document.querySelector('.stick-zone'));
}

let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* 忽略 */ }
}
document.addEventListener('pointerdown', keepAwake, { once: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

/* 启动 */
(function boot() {
  /* 手柄默认值同步车端限速 */
  spd.value = '50';
  spdVal.innerText = '50%';
  updateCompass(0);
  resizeMap();
  sizeStick();
  setInterval(() => {
    if (mask !== 0 && Date.now() - lastTx > 200) sendMask();
  }, 100);
  requestAnimationFrame(loop);
  pollTelemetry();

  /* 深链：手机浏览器可以直接收藏 http://ip:8080/mobile.html#auto */
  if (location.hash === '#auto') setTimeout(openAuto, 120);
  else if (location.hash === '#draw') setTimeout(() => { openAuto(); drawModeOn(true); }, 120);

  if (!location.protocol.startsWith('http')) {
    toast('请通过电脑服务打开：<br>http://电脑IP:8080/mobile.html', 6000);
  }
})();
</script>
</body>
